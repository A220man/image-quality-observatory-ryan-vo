services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      AUTH_MODE: oidc
      BIND_HOST: 0.0.0.0
      DATABASE_PATH: /data/observatory.db
      COOKIE_SECURE: 'true'
      FRONTEND_URL: ${FRONTEND_URL:?Set the public HTTPS origin}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:?Set the identity discovery URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the OIDC client ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set the public HTTPS callback URL}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-realm_access.roles}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - quality-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  quality-data:
